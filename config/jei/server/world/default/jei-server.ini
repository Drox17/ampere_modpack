# Nombre: Permisos de trucos del servidor
# Descripción: Elige quién puede usar el modo de trucos de JEI en este servidor.
[permissions]
	# Nombre: Permitir el modo de trucos a operadores
	# Descripción: Permite usar el modo de trucos de JEI a los jugadores con permisos de operador (/op).
	# Valores válidos: [true, false]
	# Valor predeterminado: true
	enableCheatModeForOp = true

	# Nombre: Permitir el modo de trucos en creativo
	# Descripción: Permite usar el modo de trucos de JEI a los jugadores en modo creativo.
	# Valores válidos: [true, false]
	# Valor predeterminado: true
	enableCheatModeForCreative = true

	# Nombre: Permitir el modo de trucos con permiso de /give
	# Descripción: Permite usar el modo de trucos de JEI a los jugadores que pueden ejecutar el comando /give.
	# Valores válidos: [true, false]
	# Valor predeterminado: false
	enableCheatModeForGive = false


